---
# The container runs as uid 1000 and owns the world.
- name: Create Minecraft directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ minecraft_dir }}"
    - "{{ minecraft_dir }}/data"

- name: Deploy Minecraft docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ minecraft_dir }}/docker-compose.yml"
    owner: "1000"
    group: "1000"
    mode: "0644"
  notify: Recreate minecraft

- name: Start Minecraft
  community.docker.docker_compose_v2:
    project_src: "{{ minecraft_dir }}"
    state: present
