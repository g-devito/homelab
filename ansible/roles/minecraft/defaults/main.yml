---
# Fabric server for a couple of players on the LAN. Fabric without mods behaves
# like vanilla, and mods are added later with minecraft_modrinth_projects.
# The Minecraft version is pinned on purpose: mods lag behind new releases, so
# an automatic update would break the world or the mods. Change it by hand
# (VM snapshot first) when the mods you use support the new release.
# renovate: datasource=docker depName=itzg/minecraft-server
minecraft_image: itzg/minecraft-server:2026.10.1-java25
minecraft_version: "26.3"
minecraft_dir: /opt/homelab/minecraft
minecraft_port: 25565
# Setting this to true accepts the Minecraft EULA (https://aka.ms/MinecraftEULA).
minecraft_eula: true
minecraft_motd: gionet
minecraft_max_players: 4
minecraft_difficulty: normal
minecraft_view_distance: 12
# Java heap; the container limit leaves room for the JVM itself.
minecraft_memory: 2G
minecraft_memory_limit: 3g
# Mods from Modrinth (project slugs), installed by the server on start.
# Graphics mods (Sodium, Iris, shader packs) are client only: not listed here.
# Mods that add content also have to be installed on every player's client.
minecraft_modrinth_projects:
  # Required by almost every Fabric mod.
  - fabric-api
  # Halloween test mods, checked to load on a 26.3 server (they have to be on
  # the clients too): holiday decorations and spooky food. Carved Pumpkins and
  # Spooky Doors were left out: the first crashes a dedicated server, the
  # second needs the Balm library, which Modrinth does not declare.
  - macaws-holidays
  - spooky-foods
# Players allowed to join (their Minecraft Java profile names). While empty the
# server is open to anybody on the LAN; the players still need a paid account.
minecraft_whitelist: []
