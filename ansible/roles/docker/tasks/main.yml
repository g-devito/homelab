- name: Install required system packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-docker
    state: present
    update_cache: yes

- name: Set Docker apt architecture
  ansible.builtin.set_fact:
    docker_apt_arch: "{{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else ansible_architecture }}"
- name: Create dir for Docker's GPG key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Add Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true
- name: Add Docker Repository
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    owner: root
    group: root
    mode: '0644'
- name: Install Docker Engine and plugins
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
- name: Add current user to Docker's group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
- name: Configure the Docker daemon
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart docker

# Updates leave the previous image versions behind; remove the ones no container uses every week.
- name: Install the weekly Docker image prune service
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-image-prune.service
    content: |
      [Unit]
      Description=Remove Docker images not used by any container
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker image prune --all --force
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Install the weekly Docker image prune timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-image-prune.timer
    content: |
      [Unit]
      Description=Weekly Docker image prune

      [Timer]
      OnCalendar=Sun 04:30
      Persistent=true

      [Install]
      WantedBy=timers.target
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Flush handlers so the timer unit is known to systemd
  ansible.builtin.meta: flush_handlers

- name: Enable the weekly Docker image prune timer
  ansible.builtin.systemd:
    name: docker-image-prune.timer
    enabled: true
    state: started
  when: not ansible_check_mode
