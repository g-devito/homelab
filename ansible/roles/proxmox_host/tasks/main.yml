---
# Base configuration of the Proxmox VE host itself.

- name: Disable enterprise repositories (no subscription)
  ansible.builtin.lineinfile:
    path: "/etc/apt/sources.list.d/{{ item }}.sources"
    regexp: '^Enabled:'
    line: "Enabled: no"
  loop:
    - pve-enterprise
    - ceph
  failed_when: false

- name: Enable the pve-no-subscription repository
  ansible.builtin.template:
    src: proxmox.sources.j2
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"

- name: Check whether the host booted in EFI mode
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: proxmox_efi

# Without this meta-package GRUB in the ESP is never updated, and a later
# upgrade can leave the host unbootable.
- name: Install EFI GRUB meta-package
  ansible.builtin.apt:
    name: grub-efi-amd64
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: proxmox_efi.stat.exists

- name: Check that the EFI system partition is mounted
  ansible.builtin.command: findmnt -n /boot/efi
  register: proxmox_esp
  changed_when: false
  failed_when: false
  check_mode: false
  when: proxmox_efi.stat.exists

- name: Fail if the ESP is not mounted
  ansible.builtin.fail:
    msg: >-
      /boot/efi is not mounted, so GRUB updates cannot reach the ESP.
      Add the ESP to /etc/fstab (lsblk -f shows its vfat UUID) and mount it.
  when: proxmox_efi.stat.exists and proxmox_esp.rc != 0

- name: Install UPS and disk health tools
  ansible.builtin.apt:
    name:
      - nut-server
      - nut-client
      - smartmontools
    state: present
  register: proxmox_nut_pkgs
  notify: Reload udev for the UPS

# The USB permissions from NUT's udev rules are needed before the driver starts.
- name: Apply NUT udev rules right after first install
  ansible.builtin.meta: flush_handlers

- name: Configure NUT
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/nut/{{ item.dest }}"
    owner: root
    group: nut
    mode: "0640"
  loop:
    - { src: nut.conf.j2, dest: nut.conf }
    - { src: ups.conf.j2, dest: ups.conf }
    - { src: upsd.conf.j2, dest: upsd.conf }
    - { src: upsd.users.j2, dest: upsd.users }
    - { src: upsmon.conf.j2, dest: upsmon.conf }
  loop_control:
    label: "{{ item.dest }}"
  no_log: "{{ item.dest in ['upsd.users', 'upsmon.conf'] }}"
  notify: Restart nut

- name: Install UPS event notifier
  ansible.builtin.template:
    src: nut-notify.sh.j2
    dest: /usr/local/sbin/nut-notify
    mode: "0755"

- name: Enable NUT services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nut-server
    - nut-monitor

# Proxmox's own notifications (and root's mail, via proxmox-mail-forward) go to root@pam's address.
- name: Read root@pam's notification address
  ansible.builtin.command: pveum user list --output-format json
  register: proxmox_users
  changed_when: false
  check_mode: false

- name: Send Proxmox notifications to the alert address
  ansible.builtin.command: pveum user modify root@pam --email {{ alert_email }}
  when: >-
    (proxmox_users.stdout | from_json | selectattr('userid', 'equalto', 'root@pam')
    | map(attribute='email') | first | default('')) != alert_email
  changed_when: true

- name: Configure smartd self-tests and alerts
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: /etc/smartd.conf
    mode: "0644"
  notify: Restart smartd

# Debian security fixes only (the default origins); Proxmox packages and kernels are left to
# the monthly maintenance window (ansible/maintenance.yml). Never reboots by itself.
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable daily security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Report unattended-upgrades only on errors
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      // Managed by Ansible
      Unattended-Upgrade::Mail "root";
      Unattended-Upgrade::MailReport "only-on-error";
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"

- name: Read BIOS "After Power Loss" setting
  ansible.builtin.slurp:
    src: /sys/class/firmware-attributes/thinklmi/attributes/After Power Loss/current_value
  register: proxmox_power_loss
  failed_when: false

- name: Make the host power on again after a power loss
  ansible.builtin.shell: >-
    printf '%s' {{ bios_after_power_loss | quote }}
    > '/sys/class/firmware-attributes/thinklmi/attributes/After Power Loss/current_value'
  changed_when: true
  when:
    - proxmox_power_loss.content is defined
    - (proxmox_power_loss.content | b64decode | trim) != bios_after_power_loss

- name: Keep the host's USB storage drivers off passed-through disks
  ansible.builtin.copy:
    dest: /etc/modprobe.d/no-usb-storage.conf
    content: |
      # Managed by Ansible: USB disks belong to VMs (passthrough), not to the host.
      blacklist uas
      blacklist usb_storage
      install uas /bin/false
      install usb_storage /bin/false
    mode: "0644"
  when: proxmox_block_usb_storage
  register: proxmox_usb_blacklist

- name: Rebuild initramfs so the blacklist also applies at early boot
  ansible.builtin.command: update-initramfs -u -k all
  when: proxmox_usb_blacklist.changed

- name: Unload USB storage drivers already loaded on the host
  ansible.builtin.shell: |
    for m in uas usb_storage; do
      if lsmod | grep -q "^$m "; then modprobe -r "$m" && echo "unloaded $m"; fi
    done
  register: proxmox_usb_unload
  changed_when: "'unloaded' in proxmox_usb_unload.stdout"
  when: proxmox_block_usb_storage

- name: Read VM configs for USB passthrough
  ansible.builtin.command: "qm config {{ item.vmid }}"
  register: proxmox_vm_cfg
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_vm_usb }}"
  loop_control:
    label: "{{ item.vmid }} {{ item.slot }}"

- name: Pass USB devices through to VMs (hotplugged, no VM restart)
  ansible.builtin.command: "qm set {{ item.item.vmid }} --{{ item.item.slot }} {{ item.item.device }}"
  when: "(item.item.slot ~ ': ' ~ item.item.device) not in item.stdout_lines"
  changed_when: true
  loop: "{{ proxmox_vm_cfg.results }}"
  loop_control:
    label: "{{ item.item.vmid }} {{ item.item.slot }}"

- name: Mount the VM data disk (nofail, by UUID)
  ansible.posix.mount:
    path: "{{ proxmox_data_mount }}"
    src: "UUID={{ proxmox_data_disk_uuid }}"
    fstype: ext4
    opts: "defaults,nofail,x-systemd.device-timeout=15s"
    passno: "2"
    state: mounted
  when: proxmox_data_disk_uuid | length > 0

- name: Read the configured Proxmox storages
  ansible.builtin.command: pvesm status
  register: proxmox_storages
  changed_when: false
  check_mode: false
  when: proxmox_data_disk_uuid | length > 0

- name: Register the data disk as a Proxmox directory storage
  ansible.builtin.command: >-
    pvesm add dir {{ proxmox_data_storage_id }}
    --path {{ proxmox_data_mount }} --content images --is_mountpoint 1
  when:
    - proxmox_data_disk_uuid | length > 0
    - proxmox_storages.stdout is not search('^' ~ proxmox_data_storage_id ~ ' ', multiline=True)
  changed_when: true

# Cloud-init user data of the VMs that OpenTofu creates (infra/proxmox) is a snippet on this storage.
- name: Read the content types of the snippet storage
  ansible.builtin.command: pvesh get /storage/{{ proxmox_snippets_storage_id }} --output-format json
  register: proxmox_snippets_storage
  changed_when: false
  check_mode: false

- name: Allow snippets on the snippet storage
  ansible.builtin.command: >-
    pvesm set {{ proxmox_snippets_storage_id }}
    --content {{ (((proxmox_snippets_storage.stdout | from_json).content.split(',')) + ['snippets']) | join(',') }}
  when: "'snippets' not in (proxmox_snippets_storage.stdout | from_json).content.split(',')"
  changed_when: true

- name: Create the snippets directory
  ansible.builtin.file:
    path: "{{ proxmox_snippets_dir }}"
    state: directory
    mode: "0755"

- name: Install the cloud-init user data for new VMs
  ansible.builtin.template:
    src: debian-user-data.yaml.j2
    dest: "{{ proxmox_snippets_dir }}/debian-user-data.yaml"
    mode: "0644"
