---
proxmox_suite: trixie

# NUT, standalone: the UPS is plugged into this host over USB.
nut_ups_name: ups
nut_ups_driver: usbhid-ups
nut_ups_vendorid: "0463"
nut_ups_desc: "Eaton Ellipse PRO 1200"

# smartd: short self-test daily at 02:00, long self-test Saturdays at 03:00.
# Info on temperature >= 55C, critical (mail) >= 65C.
smartd_schedule: "(S/../.././02|L/../../6/03)"
# -W diff,info,critical in Celsius. The NVMe of the host reaches 55 under a long restore or
# a backup (its own warning threshold is 81): mail only above 65.
smartd_temperature: "4,55,65"

# Lenovo BIOS setting via thinklmi; host must power back on after an outage.
bios_after_power_loss: "Power On"

proxmox_vm_usb: []

# USB disks are passed through to VMs. If the host's own usb-storage/uas driver
# also grabs them, host and guest read the disk at once and I/O aborts.
proxmox_block_usb_storage: true

# Disk behind the `data-1tb` directory storage (VM disk images, local restic repo).
# Mounted by UUID with nofail so a missing or swapped disk never blocks the boot.
# Never formatted by this role: after changing the disk, `mkfs.ext4 -L data` it,
# put its UUID in group_vars/proxmox.yml and run the role.
proxmox_data_disk_uuid: ""
proxmox_data_mount: /mnt/data
proxmox_data_storage_id: data-1tb

# Storage that holds the cloud-init user data referenced by OpenTofu (infra/proxmox).
proxmox_snippets_storage_id: local
proxmox_snippets_dir: /var/lib/vz/snippets
