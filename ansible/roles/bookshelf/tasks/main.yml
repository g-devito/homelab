---
- name: Create Bookshelf directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ bookshelf_dir }}"
    - "{{ bookshelf_dir }}/config"

- name: Deploy Bookshelf docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bookshelf_dir }}/docker-compose.yml"
    owner: "1000"
    group: "1000"
    mode: "0644"
  notify: Recreate bookshelf

- name: Start Bookshelf
  community.docker.docker_compose_v2:
    project_src: "{{ bookshelf_dir }}"
    state: present
