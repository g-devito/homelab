---
# Never bind-mount an unmounted /mnt/media: the apps would write to the VM disk.
- name: Check that the media disk is mounted
  ansible.builtin.command: mountpoint -q {{ bookshelf_media_mount }}
  changed_when: false
  check_mode: false

- name: Create Bookshelf directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ bookshelf_dir }}"
    - "{{ bookshelf_dir }}/config"

- name: Deploy Bookshelf docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bookshelf_dir }}/docker-compose.yml"
    owner: "1000"
    group: "1000"
    mode: "0644"
  notify: Recreate bookshelf

- name: Start Bookshelf
  community.docker.docker_compose_v2:
    project_src: "{{ bookshelf_dir }}"
    state: present
