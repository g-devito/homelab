---
- name: Disable UAS for known-bad USB bridges
  ansible.builtin.copy:
    dest: /etc/modprobe.d/media-disk-quirks.conf
    content: |
      # Managed by Ansible (media_storage)
      options usb-storage quirks={{ media_disk_usb_quirks | join(',') }}
    mode: "0644"
  when: media_disk_usb_quirks | length > 0

- name: Mount the media disk
  ansible.posix.mount:
    path: "{{ media_mount_point }}"
    src: "LABEL={{ media_disk_label }}"
    fstype: "{{ media_disk_fstype }}"
    opts: "{{ media_disk_options }}"
    state: mounted

- name: Create the bind mount targets
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ media_bind_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Bind-mount music and downloads from the media disk
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: none
    opts: "bind,nofail,x-systemd.requires-mounts-for={{ media_mount_point }}"
    state: mounted
  loop: "{{ media_bind_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Give the USB media disk a stable name
  ansible.builtin.template:
    src: 99-media-disk.rules.j2
    dest: /etc/udev/rules.d/99-media-disk.rules
    mode: "0644"
  register: media_udev_rule

- name: Apply the udev rule to the disk already plugged in
  ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger --subsystem-match=block --action=add
  when: media_udev_rule.changed

# The Seagate USB bridge does not pass ATA commands through the VM's USB passthrough
# (smartctl -d sat/scsi/usbsunplus all fail), so smartd has nothing to read here. Real
# SMART runs on the Proxmox host for its own disks. This disk is watched by media-disk-alert.
- name: Stop smartd, it cannot read the passed-through USB disk
  ansible.builtin.systemd:
    name: smartmontools
    enabled: false
    state: stopped
  # smartmontools may be absent or already failed on a fresh VM.
  failed_when: false

- name: Remove the smartd config and VM override
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/smartd.conf
    - /etc/systemd/system/smartmontools.service.d
  register: media_smartd_removed

- name: Reload systemd after removing the smartd override
  ansible.builtin.systemd:
    daemon_reload: true
  when: media_smartd_removed.changed

- name: Install the media disk check
  ansible.builtin.template:
    src: media-disk-alert.sh.j2
    dest: /usr/local/sbin/media-disk-alert
    mode: "0755"

- name: Install the media disk check units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - media-disk-alert.service
    - media-disk-alert.timer
  register: media_alert_units

- name: Reload systemd after unit changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: media_alert_units.changed

- name: Enable the media disk check
  ansible.builtin.systemd:
    name: media-disk-alert.timer
    enabled: true
    state: started
  # In --check the unit files were not written yet.
  ignore_errors: "{{ ansible_check_mode }}"
