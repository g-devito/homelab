---
# External media disk (films/series), ext4 so hardlinks and permissions work for
# the arr stack. Never formatted by this role. Any disk works as long as its
# partition is labelled "Media" and it is the only USB disk on the VM.
media_mount_point: /mnt/media
media_disk_label: Media
media_disk_fstype: ext4
media_disk_options: "noatime,nofail,x-systemd.device-timeout=15s"
# udev gives the USB disk a stable name that does not depend on its serial.
media_disk_device: /dev/media-disk
# USB-SATA bridges that misbehave with UAS under passthrough (reads abort, the
# disk resets every 30s). "vid:pid:u" makes them use the plain usb-storage driver.
media_disk_usb_quirks:
  - "18a5:0411:u"   # Verbatim Portable USB3.0 (HGST 500G)
  - "0bc2:2038:u"   # Seagate Expansion (ST6000DM003)

# Directories that keep their historical path under /opt/homelab but live on the media disk
# (music library and the shared downloads dir, hardlinked to each other). Containers and the
# backup (/opt/homelab) are unchanged. If the media disk is missing at boot the bind mount
# is skipped and the containers see an empty directory, like the media library.
media_bind_mounts:
  - { src: "{{ media_mount_point }}/Musica", path: /opt/homelab/navidrome/music }
  - { src: "{{ media_mount_point }}/downloads", path: /opt/homelab/downloads }
