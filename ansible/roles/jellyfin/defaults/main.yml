---
jellyfin_image: jellyfin/jellyfin:12.3
jellyfin_data_dir: /opt/homelab/jellyfin
jellyfin_media_dir: "{{ media_mount_point | default('/mnt/media') }}"
# LAN only (home use); not exposed through Traefik.
jellyfin_lan_bind: "{{ ansible_host }}:8096"
jellyfin_admin_user: gio
jellyfin_ui_culture: it
# Titles, plots and posters: English, the original language of most of the library.
jellyfin_metadata_language: en
jellyfin_metadata_country: US
# Folders on the media disk -> Jellyfin libraries.
jellyfin_libraries:
  - { name: Film, type: movies, path: /media/Film }
  - { name: Serie, type: tvshows, path: /media/Serie }
# Transcoding is software-only (the VM has no GPU) and writes to the cache on the root disk.
# Without these two options ffmpeg runs ahead of the player and keeps every segment: one 4K remux
# filled the 36 GB of free space in minutes. With them a session holds about keep_seconds of video.
jellyfin_transcode_throttling: true
jellyfin_transcode_delete_segments: true
jellyfin_transcode_keep_seconds: 720
# Transcoding segments go to the media disk (terabytes free) instead of the root disk, so a
# transcode can never fill the system. Used only while the media disk is mounted.
jellyfin_transcode_dir: "{{ jellyfin_media_dir }}/.transcodes"
jellyfin_transcode_container_dir: /transcodes
