---
# The container runs as uid 1000 and owns the world.
- name: Create Luanti directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ luanti_dir }}"
    - "{{ luanti_dir }}/data"
    - "{{ luanti_dir }}/data/games"
    - "{{ luanti_dir }}/data/main-config"

- name: Record the VoxeLibre version
  ansible.builtin.copy:
    content: "{{ luanti_voxelibre_version }}\n"
    dest: "{{ luanti_dir }}/voxelibre.version"
    owner: "1000"
    group: "1000"
    mode: "0644"
  register: luanti_game_version

- name: Remove the previous VoxeLibre
  ansible.builtin.file:
    path: "{{ luanti_dir }}/data/games/{{ luanti_game_id }}"
    state: absent
  when: luanti_game_version.changed
  notify: Recreate luanti

- name: Create the VoxeLibre directory
  ansible.builtin.file:
    path: "{{ luanti_dir }}/data/games/{{ luanti_game_id }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Download VoxeLibre
  ansible.builtin.get_url:
    url: "https://github.com/VoxeLibre/VoxeLibre/archive/refs/tags/{{ luanti_voxelibre_version }}.tar.gz"
    dest: "{{ luanti_dir }}/voxelibre-{{ luanti_voxelibre_version }}.tar.gz"
    checksum: "sha256:{{ luanti_voxelibre_sha256 }}"
    owner: "1000"
    group: "1000"
    mode: "0644"

- name: Install VoxeLibre
  ansible.builtin.unarchive:
    src: "{{ luanti_dir }}/voxelibre-{{ luanti_voxelibre_version }}.tar.gz"
    dest: "{{ luanti_dir }}/data/games/{{ luanti_game_id }}"
    remote_src: true
    owner: "1000"
    group: "1000"
    extra_opts: ["--strip-components=1"]
    creates: "{{ luanti_dir }}/data/games/{{ luanti_game_id }}/game.conf"
  notify: Recreate luanti

- name: Create the Luanti mod directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ luanti_dir }}/data/mods"
    - "{{ luanti_dir }}/mods-state"

- name: Record the mod versions
  ansible.builtin.copy:
    content: "{{ item.sha256 }}\n"
    dest: "{{ luanti_dir }}/mods-state/{{ item.name }}.sha256"
    owner: "1000"
    group: "1000"
    mode: "0644"
  loop: "{{ luanti_mods }}"
  loop_control:
    label: "{{ item.name }}"
  register: luanti_mod_versions

- name: Remove the mods that changed
  ansible.builtin.file:
    path: "{{ luanti_dir }}/data/mods/{{ item.item.name }}"
    state: absent
  loop: "{{ luanti_mod_versions.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.changed
  notify: Recreate luanti

- name: Download the mods
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ luanti_dir }}/mods-state/{{ item.name }}.tar.gz"
    checksum: "sha256:{{ item.sha256 }}"
    owner: "1000"
    group: "1000"
    mode: "0644"
  loop: "{{ luanti_mods }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the mod folders
  ansible.builtin.file:
    path: "{{ luanti_dir }}/data/mods/{{ item.name }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop: "{{ luanti_mods }}"
  loop_control:
    label: "{{ item.name }}"

- name: Unpack the mods
  ansible.builtin.unarchive:
    src: "{{ luanti_dir }}/mods-state/{{ item.item.name }}.tar.gz"
    dest: "{{ luanti_dir }}/data/mods/{{ item.item.name }}"
    remote_src: true
    owner: "1000"
    group: "1000"
    extra_opts: ["--strip-components=1"]
  loop: "{{ luanti_mod_versions.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.changed
  notify: Recreate luanti

# world.mt exists once the server has started once; on a brand new install run
# the role a second time to switch the mods on.
- name: Look for the world settings
  ansible.builtin.stat:
    path: "{{ luanti_dir }}/data/worlds/{{ luanti_world }}/world.mt"
  register: luanti_world_mt

- name: Switch the mods on in the world
  ansible.builtin.lineinfile:
    path: "{{ luanti_dir }}/data/worlds/{{ luanti_world }}/world.mt"
    regexp: "^load_mod_{{ item }} ="
    line: "load_mod_{{ item }} = true"
  loop: "{{ luanti_mods | map(attribute='enable') | flatten }}"
  when: luanti_world_mt.stat.exists
  notify: Recreate luanti

- name: Deploy the Luanti server settings
  ansible.builtin.template:
    src: minetest.conf.j2
    dest: "{{ luanti_dir }}/data/main-config/minetest.conf"
    owner: "1000"
    group: "1000"
    mode: "0644"
  notify: Recreate luanti

- name: Deploy Luanti docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ luanti_dir }}/docker-compose.yml"
    owner: "1000"
    group: "1000"
    mode: "0644"
  notify: Recreate luanti

- name: Start Luanti
  community.docker.docker_compose_v2:
    project_src: "{{ luanti_dir }}"
    state: present
