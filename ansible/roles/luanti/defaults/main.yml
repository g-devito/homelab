---
# Luanti (the open source voxel engine) running VoxeLibre, the game closest to
# Minecraft Java: survival, mobs, redstone, villages, Nether and End.
# The server and the players' Luanti clients should be the same version; the
# client comes from Flathub, so check what it ships before bumping the image.
# renovate: datasource=docker depName=lscr.io/linuxserver/luanti
luanti_image: lscr.io/linuxserver/luanti:5.17.0
luanti_dir: /opt/homelab/luanti
luanti_port: 30000
luanti_memory_limit: 2g
# VoxeLibre is not in the image: it is downloaded from its GitHub tag.
luanti_voxelibre_version: "0.92.3"
luanti_voxelibre_sha256: 3e76a4cca002307e59cd68bb97c7415117ea8393e20f87f27a75e236451f2ab0
luanti_game_id: mineclone2
luanti_server_name: gionet
luanti_server_description: Homelab LAN server
luanti_motd: Benvenuti su gionet
luanti_max_users: 4
# The world is created on first start; its name is the folder under worlds/.
luanti_world: world
# Player with every privilege (needed for WorldEdit, e.g. //pos1, //set).
luanti_admin: gio
# Mods on top of VoxeLibre, pinned to a commit with their sha256. Most mods on
# ContentDB are written for Minetest Game and do not load here: only add mods
# made for VoxeLibre/MineClone2 and try them on a throwaway server first.
# `enable` lists the mods of the package to switch on in world.mt. Mods that
# VoxeLibre already ships (mcl_cozy) must not be added again, and worldedit_gui
# needs a GUI mod VoxeLibre does not have.
luanti_mods:
  - name: mcl_decor
    url: https://codeberg.org/EmoryNB/mcl_decor/archive/c5492a6abc8d3477f31ab8c83ad0420a9734596f.tar.gz
    sha256: 637f6b20c0c150a5d2abda8ff04c581ffa5624070451a590f8feca1e3d853df3
    enable: [mcl_decor]
  - name: mcl_morefood
    url: https://codeberg.org/EmoryNB/mcl_morefood/archive/96027a1348b1c080b40f257369f6960a8238677d.tar.gz
    sha256: 9646a3360c66b35a50c560afd537d12fa330830a25661ae386d5ab601b8ac470
    enable: [mcl_morefood]
  - name: worldedit
    url: https://github.com/Uberi/Minetest-WorldEdit/archive/62ffafe3bcb386600c431ef3840d91c3c8f85639.tar.gz
    sha256: 0a99f7bcf3f0d63042467198072d48b812662b59d72b0aa3a091433d9330c078
    enable: [worldedit, worldedit_brush, worldedit_commands, worldedit_shortcommands]
