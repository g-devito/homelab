---
- name: Create LazyLibrarian directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ lazylibrarian_dir }}"
    - "{{ lazylibrarian_dir }}/config"

- name: Check that the media disk is mounted
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ media_mount_point }}"
  changed_when: false

- name: Create book download directories on the media disk
  ansible.builtin.file:
    path: "{{ media_mount_point }}/torrents/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - books
    - audiobooks

- name: Deploy LazyLibrarian docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ lazylibrarian_dir }}/docker-compose.yml"
    owner: "1000"
    group: "1000"
    mode: "0644"
  notify: Recreate lazylibrarian

- name: Start LazyLibrarian
  community.docker.docker_compose_v2:
    project_src: "{{ lazylibrarian_dir }}"
    state: present
