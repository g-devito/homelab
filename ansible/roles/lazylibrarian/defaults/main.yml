---
# renovate: datasource=docker depName=lscr.io/linuxserver/lazylibrarian
lazylibrarian_version: "e1c1040d-ls376"
lazylibrarian_dir: /opt/homelab/lazylibrarian
lazylibrarian_domain: lazylibrarian.gionet.eu
# Only these networks may reach it through Traefik; an empty list makes it public.
lazylibrarian_allowed_ranges:
  - 192.168.1.0/24
# Infrastructure only: this role deploys the container, its config dir, the LAN-only route and
# the backup label. Library, download and provider settings are configured by the owner in the app,
# and any extra bind mounts the owner wants go here (host:container[:mode]), e.g. in group_vars.
lazylibrarian_volumes: []
