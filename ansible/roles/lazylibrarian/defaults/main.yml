---
# renovate: datasource=docker depName=lscr.io/linuxserver/lazylibrarian
lazylibrarian_version: "e1c1040d-ls376"
lazylibrarian_dir: /opt/homelab/lazylibrarian
# Same model as the arr stack: published on the LAN address only, no public name, no Traefik route.
lazylibrarian_lan_ip: "{{ ansible_host }}"
# Infrastructure only: this role deploys the container, its config dir, the LAN port and
# the backup label. Provider, download-client and library settings are configured in the app.
# The media disk is mounted like in the arr stack (/mnt/media as /data) so every app sees the same
# filesystem and hardlinks work; inside the app use /data/Books, /data/Audiobooks and /data/torrents.
lazylibrarian_media_mount: "{{ media_mount_point | default('/mnt/media') }}"
# Extra bind mounts go here (host:container[:mode]).
lazylibrarian_volumes:
  - "{{ lazylibrarian_media_mount }}:/data:rslave"
# Sent by LazyLibrarian to the sites it queries. Set it to "" to leave the app default.
lazylibrarian_user_agent: "Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0"
