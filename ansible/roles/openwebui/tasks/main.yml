---
- name: Create Open WebUI data directory
  ansible.builtin.file:
    path: "{{ openwebui_dir }}/data"
    state: directory
    mode: "0755"

- name: Deploy Open WebUI docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ openwebui_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Recreate open-webui

- name: Start Open WebUI
  community.docker.docker_compose_v2:
    project_src: "{{ openwebui_dir }}"
    state: present
