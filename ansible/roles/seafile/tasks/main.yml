---
- name: Validate required Seafile secrets
  ansible.builtin.assert:
    that:
      - seafile_db_root_password is defined
      - seafile_db_password is defined
      - seafile_admin_password is defined
      - seafile_admin_email is defined
      - seafile_server_hostname is defined
    fail_msg: "Missing one or more required Seafile variables. Define them in Ansible Vault."

- name: Create Seafile directories under /opt/homelab
  ansible.builtin.file:
    path: "{{ seafile_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - { name: data, owner: 0 }
    # MariaDB runs as uid 999 inside its container and must own its datadir.
    - { name: db, owner: 999 }
  loop_control:
    label: "{{ item.name }}"

- name: Deploy Seafile docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ seafile_dir }}/docker-compose.yml"
    mode: "0600"

- name: Start Seafile
  community.docker.docker_compose_v2:
    project_src: "{{ seafile_dir }}"
    state: present

- name: Wait for seahub settings file to be created by Seafile bootstrap
  ansible.builtin.wait_for:
    path: "{{ seafile_dir }}/data/seafile/conf/seahub_settings.py"
    timeout: 180

- name: Force HTTPS service URL for Seafile
  ansible.builtin.lineinfile:
    path: "{{ seafile_dir }}/data/seafile/conf/seahub_settings.py"
    regexp: '^SERVICE_URL = '
    line: 'SERVICE_URL = "https://{{ seafile_server_hostname }}"'
  notify: Restart seafile

- name: Force HTTPS file server root for Seafile
  ansible.builtin.lineinfile:
    path: "{{ seafile_dir }}/data/seafile/conf/seahub_settings.py"
    regexp: '^FILE_SERVER_ROOT = '
    line: 'FILE_SERVER_ROOT = "https://{{ seafile_server_hostname }}/seafhttp"'
  notify: Restart seafile

- name: Add reverse-proxy CSRF settings for Seafile
  ansible.builtin.blockinfile:
    path: "{{ seafile_dir }}/data/seafile/conf/seahub_settings.py"
    marker: "# {mark} ANSIBLE MANAGED SEAFILE REVERSE PROXY"
    block: |
      USE_X_FORWARDED_HOST = True
      SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')
      CSRF_TRUSTED_ORIGINS = ['https://{{ seafile_server_hostname }}']
  notify: Restart seafile

# A hand-written override once added these networks; the template has them now.
- name: Remove the old manual network override
  ansible.builtin.file:
    path: /home/gio/seafile-network-fix.override.yml
    state: absent
