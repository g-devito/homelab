---
# Agent as a plain binary on hosts without Docker (the Proxmox host).
# When the hub play ran in this run, reuse its key; with --limit on this host,
# read it from the hub host directly.
- name: Read the hub public key from the hub host
  ansible.builtin.command: "ssh-keygen -y -f {{ beszel_data_dir }}/hub/id_ed25519"
  delegate_to: "{{ groups['homelab'][0] }}"
  become: true
  register: beszel_remote_pubkey
  changed_when: false
  check_mode: false
  when: hostvars[groups['homelab'][0]]['beszel_hub_key'] is not defined

- name: Use the hub key
  ansible.builtin.set_fact:
    beszel_hub_key: >-
      {{ hostvars[groups['homelab'][0]]['beszel_hub_key']
         | default(beszel_remote_pubkey.stdout | default('') | trim) }}

- name: Create the beszel system user
  ansible.builtin.user:
    name: beszel
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check installed agent version
  ansible.builtin.command: /usr/local/bin/beszel-agent -v
  register: beszel_agent_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the agent binary
  when: beszel_version not in (beszel_agent_installed.stdout | default(''))
  block:
    - name: Download the agent release
      ansible.builtin.unarchive:
        src: "https://github.com/henrygd/beszel/releases/download/v{{ beszel_version }}/beszel-agent_linux_amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - beszel-agent
        mode: "0755"
      notify: Restart beszel-agent

- name: Install the agent service
  ansible.builtin.template:
    src: beszel-agent.service.j2
    dest: /etc/systemd/system/beszel-agent.service
    mode: "0644"
  notify: Restart beszel-agent

- name: Enable the agent
  ansible.builtin.systemd:
    name: beszel-agent
    enabled: true
    state: started
    daemon_reload: true
