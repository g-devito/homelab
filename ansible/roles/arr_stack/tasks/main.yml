---
- name: Create arr-stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ arr_stack_dir }}"
    - "{{ arr_stack_downloads_dir }}"
    - "{{ arr_stack_downloads_dir }}/lidarr"
    - /opt/homelab/qbittorrent/config
    - /opt/homelab/prowlarr/config
    - /opt/homelab/lidarr/config
    - /opt/homelab/radarr/config
    - /opt/homelab/sonarr/config

- name: Check that the media disk is mounted
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ arr_stack_media_dir }}"
  changed_when: false

- name: Create torrent download directories on the media disk
  ansible.builtin.file:
    path: "{{ arr_stack_media_dir }}/torrents/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - tv
    - movies
    - music

- name: Deploy arr-stack docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ arr_stack_dir }}/docker-compose.yml"
    owner: "1000"
    group: "1000"
    mode: "0644"
  notify: Recreate arr stack

- name: Start arr stack
  community.docker.docker_compose_v2:
    project_src: "{{ arr_stack_dir }}"
    state: present
