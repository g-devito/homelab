---
- name: Create Vaultwarden data directory
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}/data"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Deploy Vaultwarden docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vaultwarden_dir }}/docker-compose.yml"
    owner: "1000"
    group: "1000"
    mode: "0600"
  diff: false
  notify: Recreate vaultwarden

- name: Start Vaultwarden
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_dir }}"
    state: present
