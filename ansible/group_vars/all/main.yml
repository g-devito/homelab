---
# Where every alert ends up. Mail is only sent when something is wrong.
alert_email: gio@gionet.eu
# Envelope/From domain for alerts. Needs a TXT record on this name:
#   v=spf1 ip4:<WAN IP> -all
alert_mail_domain: srv.gionet.eu
# Forward-confirmed reverse DNS of the WAN IP, used as SMTP HELO.
alert_helo_name: host-188-8-27-4.business.telecomitalia.it

# Proxmox host that relays mail for the LAN.
mail_relay_host: 192.168.1.218
mail_relay_networks: 127.0.0.0/8 [::1]/128 192.168.1.250/32

# Disk space alert threshold (filesystems and LVM thin pools), in percent.
disk_alert_threshold: 80

healthchecks_api_url: https://healthchecks.io/api/v3
