- name: Proxmox host
  hosts: proxmox
  roles:
    - { role: proxmox_host, tags: [proxmox] }
    - { role: alerting, tags: [alerting] }

- name: Homelab services
  hosts: homelab
  become: true
  roles:
    - { role: common, tags: [common] }
    - { role: storage, tags: [storage] }
    - { role: docker, tags: [docker] }
    - { role: alerting, tags: [alerting] }
    - { role: media_storage, tags: [media] }
    - { role: traefik, tags: [traefik] }
    - { role: seafile, tags: [seafile] }
    - { role: immich, tags: [immich] }
    # - { role: radicale, tags: [radicale] }
    - { role: navidrome, tags: [navidrome] }
    - { role: jellyfin, tags: [jellyfin] }
    - { role: arr_stack, tags: [arr_stack] }
    - { role: getmusic, tags: [getmusic] }
    - { role: autorestic, tags: [autorestic] }
